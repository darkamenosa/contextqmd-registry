test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

<%
  normalize_env_value = lambda do |key|
    value = ENV[key].to_s.strip
    next if value.blank?

    if (value.start_with?("\"") && value.end_with?("\"")) || (value.start_with?("'") && value.end_with?("'"))
      value = value[1...-1]
    end

    value.presence
  end

  cloudflare_account_id = normalize_env_value.call("CLOUDFLARE_ACCOUNT_ID") || Rails.application.credentials.dig(:cloudflare, :account_id)
  cloudflare_access_key_id = normalize_env_value.call("CLOUDFLARE_R2_ACCESS_KEY_ID") || Rails.application.credentials.dig(:cloudflare, :access_key_id)
  cloudflare_secret_access_key = normalize_env_value.call("CLOUDFLARE_R2_SECRET_ACCESS_KEY") || Rails.application.credentials.dig(:cloudflare, :secret_access_key)
  cloudflare_public_bucket = normalize_env_value.call("CLOUDFLARE_PUBLIC_BUCKET") || Rails.application.credentials.dig(:cloudflare, :public_bucket)
  cloudflare_private_bucket = normalize_env_value.call("CLOUDFLARE_PRIVATE_BUCKET") || Rails.application.credentials.dig(:cloudflare, :private_bucket)
%>

r2_public_assets:
  service: S3
  endpoint: https://<%= cloudflare_account_id %>.r2.cloudflarestorage.com
  access_key_id: <%= cloudflare_access_key_id %>
  secret_access_key: <%= cloudflare_secret_access_key %>
  region: auto
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
  bucket: <%= cloudflare_public_bucket %>
  public: true
  upload:
    cache_control: "public, max-age=31536000, immutable"

r2_private_assets:
  service: S3
  endpoint: https://<%= cloudflare_account_id %>.r2.cloudflarestorage.com
  access_key_id: <%= cloudflare_access_key_id %>
  secret_access_key: <%= cloudflare_secret_access_key %>
  region: auto
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
  bucket: <%= cloudflare_private_bucket %>
