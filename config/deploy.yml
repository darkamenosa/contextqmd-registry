# Name of your application. Used to uniquely configure containers.
service: contextqmd_registry

# Name of the container image.
image: tuyenhx/contextqmd_registry

# Deploy to these servers.
servers:
  web:
    - 46.225.105.37
  vite:
    hosts:
      - 46.225.105.37
    cmd: node public/vite-ssr/ssr.js
    options:
      init: true
      network-alias: vite_ssr
  job:
    hosts:
      - 46.225.105.37
    cmd: bin/jobs
    options:
      init: true

# Enable SSL auto certification via Let's Encrypt.
# Note: If using Cloudflare, set encryption mode to "Full" in SSL/TLS settings.
proxy:
  ssl: true
  host: contextqmd.com

# Credentials for your image host.
registry:
  username: tuyenhx
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - CLOUDFLARE_ACCOUNT_ID
    - CLOUDFLARE_PUBLIC_BUCKET
    - CLOUDFLARE_PRIVATE_BUCKET
    - CLOUDFLARE_PUBLIC_URL
    - CLOUDFLARE_R2_ACCESS_KEY_ID
    - CLOUDFLARE_R2_SECRET_ACCESS_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GOOGLE_SEARCH_CONSOLE_CLIENT_ID
    - GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET
  clear:
    # Dedicated job container handles queue processing.
    SOLID_QUEUE_IN_PUMA: false

    # Database configuration
    DB_HOST: contextqmd_registry-pgbouncer
    DB_DIRECT_HOST: contextqmd_registry-db
    DB_PORT: 5432
    DB_POOL: 5
    APP_HOST: contextqmd.com
    INERTIA_SSR_URL: http://vite_ssr:13714

    # Job queue configuration - conservative starting point for 4 vCPU / 7.5 GiB RAM
    JOB_CONCURRENCY: 2

    # Web server configuration - conservative starting point for 4 vCPU / 7.5 GiB RAM
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 3

# Aliases for common commands.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "DB_HOST=contextqmd_registry-db DB_PORT=5432 bin/rails dbconsole"
  dbc-pooled: app exec --interactive --reuse "DB_HOST=contextqmd_registry-pgbouncer DB_PORT=5432 bin/rails dbconsole"

# Persistent storage volume for Active Storage files.
volumes:
  - "contextqmd_registry_storage:/rails/storage"

# Bridge fingerprinted assets between versions.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch:
    - arm64

# PostgreSQL database accessory.
accessories:
  db:
    image: postgres:18.3
    host: 46.225.105.37
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: contextqmd_registry
        POSTGRES_DB: contextqmd_registry_production
      secret:
        - POSTGRES_PASSWORD
    files:
      - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - contextqmd_registry_data:/var/lib/postgresql
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    host: 46.225.105.37
    port: "127.0.0.1:6432:5432"
    env:
      secret:
        - DATABASE_URLS
      clear:
        AUTH_TYPE: scram-sha-256
        POOL_MODE: transaction
        MAX_CLIENT_CONN: 500
        DEFAULT_POOL_SIZE: 5
        MIN_POOL_SIZE: 1
        RESERVE_POOL_SIZE: 2
        RESERVE_POOL_TIMEOUT: 2
        MAX_PREPARED_STATEMENTS: 200
        IGNORE_STARTUP_PARAMETERS: extra_float_digits
